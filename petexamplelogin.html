
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f4ed;
    color: #333;
}

.page {
    min-height: 100vh;
    display: flex;
}


/* =========================
   LEFT PET SECTION
========================= */

.pet-section {
    width: 55%;
    background: #dceee7;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.pet-content {
    width: 75%;
    text-align: center;
}

.logo {
    width: 70px;
    margin-bottom: 15px;
}

.pet-content h1 {
    font-size: 48px;
    line-height: 1.15;
    color: #264d43;
}

.pet-content h1 span {
    color: #4c9a7a;
}

.pet-content p {
    margin: 20px auto;
    max-width: 500px;
    font-size: 17px;
    line-height: 1.6;
    color: #587067;
}

.pet-image img {
    width: 80%;
    max-width: 450px;
    margin-top: 15px;
    transition: transform 0.4s ease;
}

.pet-image img:hover {
    transform: translateY(-8px);
}


/* Decorative paw prints */

.pet-section::before {
    content: "🐾";
    position: absolute;
    font-size: 80px;
    top: 8%;
    left: 8%;
    opacity: 0.12;
}

.pet-section::after {
    content: "🐾";
    position: absolute;
    font-size: 100px;
    bottom: 8%;
    right: 8%;
    opacity: 0.12;
}


/* =========================
   LOGIN SECTION
========================= */

.login-section {
    width: 45%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.login-card {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 45px;
    border-radius: 25px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.10);

    animation: cardAppear 0.7s ease;
}


/* Heading */

.heading-area {
    text-align: center;
    margin-bottom: 30px;
}

.paw-circle {
    width: 65px;
    height: 65px;

    margin: 0 auto 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e5f4ed;
    border-radius: 50%;

    font-size: 30px;
}

.heading-area h2 {
    font-size: 30px;
    color: #264d43;
    margin-bottom: 8px;
}

.heading-area p {
    color: #888;
    font-size: 14px;
}


/* =========================
   INPUTS
========================= */

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: bold;

    color: #40584f;
}

.input-box {
    display: flex;
    align-items: center;

    border: 1.5px solid #ddd;

    border-radius: 12px;

    padding: 0 15px;

    transition: 0.3s;
}

.input-box span {
    margin-right: 10px;
    font-size: 17px;
}

.input-box input {
    width: 100%;

    border: none;
    outline: none;

    padding: 14px 5px;

    font-size: 14px;

    background: transparent;
}

.input-box:focus-within {
    border-color: #4c9a7a;

    box-shadow:
        0 0 0 3px rgba(76, 154, 122, 0.12);
}


/* =========================
   OPTIONS
========================= */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 12px;

    margin: 5px 0 25px;
}

.options label {
    color: #777;
}

.options input {
    accent-color: #4c9a7a;
}

.options a {
    color: #4c9a7a;
    text-decoration: none;
    font-weight: bold;
}

.options a:hover {
    text-decoration: underline;
}


/* =========================
   LOGIN BUTTON
========================= */

#btn {
    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 12px;

    background: #4c9a7a;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

#btn span {
    margin-left: 7px;
}

#btn:hover {
    background: #397e63;
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(76, 154, 122, 0.25);
}


/* =========================
   DIVIDER
========================= */

.divider {
    display: flex;
    align-items: center;

    margin: 25px 0;

    color: #aaa;

    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: #e5e5e5;
}

.divider span {
    margin: 0 12px;
}


/* =========================
   CREATE ACCOUNT
========================= */

.signup {
    text-align: center;

    font-size: 13px;

    color: #777;

    margin-bottom: 10px;
}

.create-account {
    display: block;

    text-align: center;

    padding: 12px;

    border: 1.5px solid #4c9a7a;

    border-radius: 12px;

    color: #4c9a7a;

    text-decoration: none;

    font-weight: bold;

    font-size: 14px;

    transition: 0.3s;
}

.create-account:hover {
    background: #e5f4ed;
}


/* =========================
   ANIMATION
========================= */

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 850px) {

    .page {
        flex-direction: column;
    }

    .pet-section {
        width: 100%;
        min-height: 40vh;
        padding: 40px 20px;
    }

    .pet-content {
        width: 100%;
    }

    .pet-content h1 {
        font-size: 34px;
    }

    .pet-content p {
        font-size: 14px;
    }

    .pet-image img {
        width: 60%;
        max-width: 280px;
    }

    .login-section {
        width: 100%;
        padding: 25px 15px;
    }

    .login-card {
        padding: 30px 25px;
    }

}


@media (max-width: 450px) {

    .pet-section {
        min-height: 35vh;
    }

    .pet-content h1 {
        font-size: 28px;
    }

    .pet-content p {
        font-size: 13px;
    }

    .pet-image img {
        width: 55%;
    }

    .login-card {
        padding: 25px 20px;
        border-radius: 20px;
    }

    .heading-area h2 {
        font-size: 25px;
    }

}

    </style>

</html>
